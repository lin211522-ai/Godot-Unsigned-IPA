name: Build Godot 4.4 IPA Template

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Godot 4.4
        run: |
          curl -fL https://github.com/godotengine/godot/releases/download/4.4-stable/Godot_v4.4-stable_macos.universal.zip -o godot.zip
          unzip godot.zip -d godot
          chmod +x godot/Godot.app/Contents/MacOS/Godot

      - name: Download Export Templates 4.4
        run: |
          curl -fL https://github.com/godotengine/godot/releases/download/4.4-stable/Godot_v4.4-stable_export_templates.tpz -o templates.tpz
          mkdir -p ~/Library/Application\ Support/Godot/export_templates/4.4.stable/
          unzip templates.tpz -d temp_templates
          mv temp_templates/templates/* ~/Library/Application\ Support/Godot/export_templates/4.4.stable/
          
      - name: Export Godot Project (Prepare Xcode)
        run: |
          mkdir -p build/ios
          # First, prime the engine imports
          ./godot/Godot.app/Contents/MacOS/Godot --headless --path . --editor --quit || true
          # Export to Xcode project
          ./godot/Godot.app/Contents/MacOS/Godot --headless --path . --export-release "iOS" build/ios/project.xcodeproj
        
      - name: Manual Xcode Build (Unsigned)
        run: |
          cd build/ios
          # This command forces Xcode to build the binary without needing a Provisioning Profile or Team ID
          xcodebuild -project project.xcodeproj \
            -scheme "project" \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean archive \
            -archivePath project.xcarchive
      
      - name: Package IPA Structure
        run: |
          mkdir -p build/final/Payload
          # Copy the .app folder into the Payload folder
          cp -r build/ios/project.xcarchive/Products/Applications/*.app build/final/Payload/
          cd build/final
          zip -r ../godot_4_4_template.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Godot_4_4_Base_IPA
          path: build/godot_4_4_template.ipa
