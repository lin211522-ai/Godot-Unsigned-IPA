name: Build iOS IPA

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4 # Updated to v4

      - name: Install Godot 4.4
        run: |
          curl -L https://github.com -o godot.zip
          unzip godot.zip -d godot
          chmod +x godot/Godot.app/Contents/MacOS/Godot

      - name: Download Export Templates 4.4
        run: |
          curl -L https://github.com -o templates.tpz
          mkdir -p ~/Library/Application\ Support/Godot/export_templates/4.4.stable/
          unzip templates.tpz -d temp_templates
          mv temp_templates/templates/* ~/Library/Application\ Support/Godot/export_templates/4.4.stable/
          
      - name: Export Godot Project
        run: |
          mkdir -p build/ios
          ./godot/Godot.app/Contents/MacOS/Godot --headless --path . --export-release "iOS" build/ios/project.xcodeproj
        
      - name: Build Xcode Project (Unsigned)
        run: |
          cd build/ios
          xcodebuild -project project.xcodeproj -scheme "project" -sdk iphoneos -configuration Release CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO clean archive -archivePath project.xcarchive
      
      - name: Package IPA
        run: |
          mkdir -p build/final/Payload
          cp -r build/ios/project.xcarchive/Products/Applications/*.app build/final/Payload/
          cd build/final
          zip -r ../godot_4_4_base.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4 # Updated to v4
        with:
          name: godot_4_4_base_ipa
          path: build/godot_4_4_base.ipa
